name: Inferno SMART (Phase 1)

# Runs Safire as a SMART Backend Services client against Inferno's
# SMART App Launch STU2.2 client test suite. See compliance/inferno/README.md.
# Not run on pull requests: it builds the Inferno test kit image (several minutes).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  backend-services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run Inferno harness
        run: bin/inferno-smart

      - name: Upload Inferno report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inferno-smart-backend-services
          path: |
            tmp/inferno/results.json
            tmp/inferno/report.html
          if-no-files-found: warn
