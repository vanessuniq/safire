# Single-container Inferno running the SMART App Launch test kit, for the
# Phase 1 (HTTP-only) Backend Services harness. See README.md.
#
# INFERNO_KIT_DIR must point at a checkout of
# inferno-framework/smart-app-launch-test-kit at INFERNO_KIT_REF;
# bin/inferno-smart prepares both.
name: safire-inferno

services:
  inferno:
    image: safire-inferno-smart:${INFERNO_KIT_REF:?set INFERNO_KIT_REF}
    build:
      context: ${INFERNO_KIT_DIR:?set INFERNO_KIT_DIR}
    environment:
      # Must match the URL the driver uses: Inferno embeds it in discovery
      # metadata and in the expected client assertion `aud`.
      INFERNO_HOST: http://localhost:4567
      # Run jobs in-process so redis/sidekiq are not needed.
      ASYNC_JOBS: 'false'
      # The client suite's Backend Services tests do not validate FHIR resources,
      # so the HL7 validator service is not started.
      INITIALIZE_VALIDATOR_SESSIONS: 'false'
    command: sh -c "mkdir -p data && bundle exec inferno migrate && bundle exec puma"
    ports:
      - '127.0.0.1:4567:4567'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:4567/api/version']
      interval: 3s
      timeout: 3s
      retries: 60
