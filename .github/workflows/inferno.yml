name: Inferno SMART

# Runs Safire as a SMART client against Inferno's SMART App Launch STU2.2
# client test suite: Backend Services (Phase 1) and authorization code
# standalone/EHR launch (Phase 2). See compliance/inferno/README.md.
# Not run on pull requests: it builds the Inferno test kit image (several minutes).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  smart-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run Inferno harness
        run: bin/inferno-smart

      - name: Upload Inferno report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inferno-smart-client
          path: |
            tmp/inferno/results.json
            tmp/inferno/report.html
            tmp/inferno/app-launch/results.json
            tmp/inferno/app-launch/report.html
          if-no-files-found: warn
